# AIMternet-Cafe POC environment.
#
#   conda env update -n data_eng -f environment.yml --prune   (or: make env)
#
# Python 3.12, not the 3.11 the spec suggests: Airflow 3.3.0 was already installed and
# passing `airflow db check` on 3.12 in this env, so rebuilding was judged pure downside.
# Recorded as a deviation in CLAUDE.md.
#
# pyarrow is used ONLY for Streamlit's DataFrame serialization (Arrow IPC), never for our own
# Parquet I/O -- DuckDB still owns every Parquet write/read in the pipeline. On this host
# (kernel 7.0.0-1010-aws) Arrow's thread pool was previously measured to abort at interpreter
# shutdown -- "terminate called without an active exception", SIGABRT -- 23/30 with the pip
# wheel (16.1.0 and 25.0.1) and 11/20 with conda-forge pyarrow 15 in a clean probe environment.
# fastparquet was rejected for the same reason DuckDB was chosen over pyarrow: it silently
# downcasts Decimal to float64.
#
# Re-probed 2026-09-03 to clear pyarrow for Streamlit: 30/30 clean runs of a fresh process
# round-tripping a DataFrame through pyarrow.Table.from_pandas + Arrow IPC (what
# st.dataframe/st.table do internally) with pyarrow==25.0.1 on this same kernel. As a sanity
# check on the probe methodology, a second attempt to reproduce the *original* Parquet-write
# crash with the same wheel/kernel also came back clean (0/45) -- the original finding did not
# reproduce here, for reasons not investigated further (this is a POC). Recorded as-is rather
# than overwritten: neither result invalidates the other, and DuckDB continues to own Parquet
# I/O regardless, so this addition carries no risk to that invariant either way.
#
# Airflow itself is installed via requirements-airflow.txt against its constraints file,
# not here, so pip cannot re-resolve its tree against conda's pyarrow/numpy.

name: data_eng
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # --- data ---
  - duckdb
  - pandas=2.1.4
  - numpy=1.26.4
  - pyyaml

  # --- databases ---
  - psycopg2=2.9.12
  - sqlalchemy=2.0.51

  # --- http / api ---
  - requests
  - httpx

  # --- notebooks ---
  - jupyterlab
  - notebook
  - matplotlib

  # --- quality ---
  - pytest
  - pytest-cov
  - ruff
  - mypy

  - pip:
      # Pinned to what is installed and verified working in this env.
      - fastapi==0.136.3
      - uvicorn==0.49.0
      - pydantic==2.13.4
      - pydantic-settings==2.14.2
      - boto3==1.43.0
      - redshift-connector==2.1.15
      - sqlalchemy-redshift==0.8.14
      - alembic==1.18.5
      - python-dotenv==1.2.2
      - tenacity==9.1.4
      - moto[s3,dynamodb]
      - types-PyYAML
      # Streamlit dashboard (pinned to what is installed/probed above).
      - streamlit==1.63.0
      - plotly==7.0.0
      - pyarrow==25.0.1
      # Airflow: install separately with its constraints file.
      #   -r requirements-airflow.txt --constraint <airflow constraints url>
